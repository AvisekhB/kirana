<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisekh Grocery - Owner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6 text-center">Owner Login</h2>
            <input type="email" id="login-email" placeholder="Email" class="w-full p-2 border rounded mb-4">
            <input type="password" id="login-password" placeholder="Password" class="w-full p-2 border rounded mb-4">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hidden">
        <!-- Header with Shop Status Toggle -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-700">Avisekh Grocery</h1>
            <div class="flex items-center space-x-4">
                <!-- Shop Status Toggle -->
                <div class="flex items-center space-x-2 bg-gray-50 p-2 rounded-lg border">
                    <span class="text-sm font-medium">Shop Status:</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="shop-status-toggle" class="sr-only peer" onchange="toggleShopStatus()">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
                    </label>
                    <span id="shop-status-text" class="text-sm font-semibold text-green-600">Open</span>
                </div>
                <button onclick="logout()" class="text-red-600 hover:underline">Logout</button>
            </div>
        </header>

        <!-- Tabs -->
        <div class="flex border-b bg-white px-4">
            <button onclick="showTab('orders')" class="tab-btn px-4 py-2 font-semibold text-blue-600 border-b-2 border-blue-600" data-tab="orders">Orders ● Live</button>
            <button onclick="showTab('inventory')" class="tab-btn px-4 py-2 text-gray-500 hover:text-gray-700" data-tab="inventory">Inventory</button>
            <button onclick="showTab('customers')" class="tab-btn px-4 py-2 text-gray-500 hover:text-gray-700" data-tab="customers">Customers</button>
        </div>

        <!-- Orders Tab -->
        <div id="tab-orders" class="tab-content p-4">
            <h2 class="text-xl font-bold mb-4">Live Orders</h2>
            <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-3 text-left">Order #</th>
                            <th class="p-3 text-left">Customer</th>
                            <th class="p-3 text-left">Phone</th>
                            <th class="p-3 text-left">Pickup Slot</th>
                            <th class="p-3 text-left">Total</th>
                            <th class="p-3 text-left">Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="divide-y"></tbody>
                </table>
            </div>
        </div>

        <!-- Inventory Tab -->
        <div id="tab-inventory" class="tab-content hidden p-4">
            <h2 class="text-xl font-bold mb-4">Inventory Manager</h2>
            <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-3 text-left">Name</th>
                            <th class="p-3 text-left">Type</th>
                            <th class="p-3 text-left">Unit</th>
                            <th class="p-3 text-left">Price (₹)</th>
                            <th class="p-3 text-left">Status</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body" class="divide-y"></tbody>
                </table>
            </div>
        </div>

        <!-- Customers Tab -->
        <div id="tab-customers" class="tab-content hidden p-4">
            <h2 class="text-xl font-bold mb-4">Customers (Sorted by Total Spent)</h2>
            <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-3 text-left">Name</th>
                            <th class="p-3 text-left">Phone</th>
                            <th class="p-3 text-left">Total Orders</th>
                            <th class="p-3 text-left">Total Spent</th>
                            <th class="p-3 text-left">Last Order</th>
                        </tr>
                    </thead>
                    <tbody id="customers-table-body" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- SUPABASE INIT ---
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- AUTH ---
        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else initDashboard();
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function initDashboard() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            
            loadShopStatus();
            loadOrders();
            loadInventory();
            loadCustomers();
            
            // Live Orders Subscription
            supabase.channel('orders-dashboard')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, loadOrders)
                .subscribe();
        }

        // --- SHOP STATUS TOGGLE ---
        async function loadShopStatus() {
            const { data } = await supabase.from('shop_settings').select('value').eq('key', 'is_closed').single();
            const toggle = document.getElementById('shop-status-toggle');
            const text = document.getElementById('shop-status-text');
            
            if (data && data.value === 'true') {
                toggle.checked = true;
                text.innerText = 'Closed';
                text.className = 'text-sm font-semibold text-red-600';
            } else {
                toggle.checked = false;
                text.innerText = 'Open';
                text.className = 'text-sm font-semibold text-green-600';
            }
        }

        async function toggleShopStatus() {
            const toggle = document.getElementById('shop-status-toggle');
            const text = document.getElementById('shop-status-text');
            const isClosed = toggle.checked;
            
            const { error } = await supabase.from('shop_settings').update({ value: isClosed.toString() }).eq('key', 'is_closed');
            if (error) {
                alert('Failed to update shop status');
                toggle.checked = !isClosed; 
            } else {
                text.innerText = isClosed ? 'Closed' : 'Open';
                text.className = isClosed ? 'text-sm font-semibold text-red-600' : 'text-sm font-semibold text-green-600';
            }
        }

        // --- TABS ---
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600', 'font-semibold');
                el.classList.add('text-gray-500');
            });
            
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeBtn = document.querySelector(`[data-tab="${tabName}"]`);
            activeBtn.classList.add('text-blue-600', 'border-b-2', 'border-blue-600', 'font-semibold');
            activeBtn.classList.remove('text-gray-500');
        }

        // --- DATA LOADING ---
        async function loadOrders() {
            const { data } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '';
            
            data.forEach(order => {
                let statusColor = 'bg-gray-200 text-gray-800';
                if (order.status === 'Packed') statusColor = 'bg-yellow-200 text-yellow-800';
                if (order.status === 'Picked Up') statusColor = 'bg-green-200 text-green-800';

                // Map DB status to User-Friendly Status
                let displayStatus = order.status;
                if(order.status === 'New') displayStatus = 'Order Placed';
                if(order.status === 'Packed') displayStatus = 'Packing Done';
                if(order.status === 'Picked Up') displayStatus = 'Pickup Complete';

                tbody.innerHTML += `
                    <tr>
                        <td class="p-3 font-mono text-sm">#${order.order_number}</td>
                        <td class="p-3">${order.customer_name}</td>
                        <td class="p-3">${order.customer_phone}</td>
                        <td class="p-3 text-sm">${order.pickup_slot}</td>
                        <td class="p-3 font-semibold">₹${order.total}</td>
                        <td class="p-3">
                            <select onchange="updateOrderStatus('${order.id}', this.value)" class="p-1 rounded border text-sm font-semibold ${statusColor}">
                                <option value="New" ${order.status === 'New' ? 'selected' : ''}>Order Placed</option>
                                <option value="Packed" ${order.status === 'Packed' ? 'selected' : ''}>Packing Done</option>
                                <option value="Picked Up" ${order.status === 'Picked Up' ? 'selected' : ''}>Pickup Complete</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
        }

        async function updateOrderStatus(orderId, newStatus) {
            await supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
            loadOrders();
        }

        async function loadInventory() {
            const { data } = await supabase.from('products').select('*').order('name');
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = '';
            data.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-3">${p.name}</td>
                        <td class="p-3 text-sm">${p.pricing_type}</td>
                        <td class="p-3 text-sm">${p.unit}</td>
                        <td class="p-3">₹${p.price}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs ${p.active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${p.active ? 'Active' : 'Inactive'}</span></td>
                    </tr>
                `;
            });
        }

        async function loadCustomers() {
            const { data } = await supabase.from('customers').select('*').order('total_spent', { ascending: false });
            const tbody = document.getElementById('customers-table-body');
            tbody.innerHTML = '';
            data.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-3">${c.name}</td>
                        <td class="p-3">${c.phone}</td>
                        <td class="p-3">${c.total_orders}</td>
                        <td class="p-3 font-semibold">₹${c.total_spent}</td>
                        <td class="p-3 text-sm">${new Date(c.last_order_date).toLocaleDateString()}</td>
                    </tr>
                `;
            });
        }

        // Auto-init if already logged in
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) initDashboard();
        });
    </script>
</body>
</html>
