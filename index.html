
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisekh Grocery - Order Online</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        header { background: #2e7d32; color: white; padding: 20px; text-align: center; }
        .info-bar { background: #e8f5e9; padding: 10px; text-align: center; font-size: 0.9em; border-bottom: 1px solid #ccc; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        /* Product Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card h3 { margin: 10px 0; font-size: 1.1em; }
        .product-card .price { font-weight: bold; color: #2e7d32; font-size: 1.2em; }
        .add-btn { background: #2e7d32; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        
        /* Floating Cart */
        .floating-cart { position: fixed; bottom: 20px; right: 20px; background: #2e7d32; color: white; padding: 15px 25px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 100; }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-top: 0; border-bottom: 2px solid #2e7d32; padding-bottom: 10px; }
        
        /* Form */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-primary { background: #2e7d32; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 1.1em; cursor: pointer; }
        .btn-secondary { background: white; color: #2e7d32; border: 2px solid #2e7d32; padding: 12px; width: 100%; border-radius: 5px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
        
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .total-display { font-size: 1.5em; font-weight: bold; text-align: right; margin: 15px 0; }
    </style>
</head>
<body>

<header>
    <h1>Avisekh Grocery</h1>
    <p>Order Online, Pick Up In Store</p>
</header>
<div class="info-bar">
    Address: Burnpur, West Bengal | Contact: +91 9999999999 | Hours: 9:00 AM - 8:00 PM
</div>

<div class="container">
    <h2 id="loading-msg">Loading products...</h2>
    <div class="products-grid" id="products-grid"></div>
</div>

<div class="floating-cart" id="open-cart-btn">
    Total: ₹<span id="float-total">0</span> | <span id="float-count">0</span> items<br>View Cart & Checkout
</div>

<!-- Cart Modal -->
<div class="modal-overlay" id="cart-modal">
    <div class="modal">
        <h2>Your Cart</h2>
        <div id="cart-items-list"></div>
        <div class="total-display">Total: ₹<span id="modal-total">0</span></div>
        
        <form id="order-form">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="cust-name" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="cust-phone" pattern="[0-9]{10}" required>
            </div>
            <div class="form-group">
                <label>Pickup Date</label>
                <input type="date" id="pickup-date" required>
            </div>
            <div class="form-group">
                <label>Pickup Time</label>
                <select id="pickup-time" required>
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="12:00">12:00</option>
                    <option value="18:30">18:30</option>
                </select>
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select id="pay-method" required>
                    <option value="Cash">Cash at pickup</option>
                    <option value="UPI">UPI at pickup</option>
                    <option value="Advance UPI">Advance UPI (Applez@upi)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Note (Optional)</label>
                <textarea id="order-note" rows="2"></textarea>
            </div>
            <button type="submit" class="btn-primary">Place Order</button>
            <button type="button" class="btn-secondary" id="close-cart-btn">Keep Shopping</button>
        </form>
    </div>
</div>

<!-- Success Modal -->
<div class="modal-overlay" id="success-modal">
    <div class="modal" style="text-align:center;">
        <h2 style="color:green; border:none;">Order Placed!</h2>
        <p>Your Order Number:</p>
        <h1 id="success-order-id" style="color:green;"></h1>
        <button class="btn-primary" onclick="location.reload()">Place Another Order</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. SUPABASE SETUP (THE FIX)
    // ==========================================
    // REPLACE THESE WITH YOUR ACTUAL KEYS
        const SUPABASE_URL = "https://makoyqtelhqemvyabvxs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ha295cXRlbGhxZW12eWFidnhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDI3NzgsImV4cCI6MjEwMzk3ODc3OH0.4VjPjWWav5vBWI5klAPb24NiHPXDQPoioOxJL3yHPoc";


    // Initialize the client correctly
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. APP LOGIC
    // ==========================================
    let cart = [];
    let products = [];

    // Load Products
    async function loadProducts() {
        // Use 'db' here, not 'supabase'
        const { data, error } = await db.from('products').select('*').eq('active', true);
        
        if (error) {
            console.error(error);
            document.getElementById('loading-msg').innerText = 'Error loading products.';
            return;
        }
        
        products = data;
        document.getElementById('loading-msg').style.display = 'none';
        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById('products-grid');
        products.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-card';
            div.innerHTML = `
                <h3>${p.name}</h3>
                <p>${p.unit}</p>
                <div class="price">₹${p.price}</div>
                <button class="add-btn" onclick="addToCart('${p.id}')">Add</button>
            `;
            grid.appendChild(div);
        });
    }

    window.addToCart = (id) => {
        const product = products.find(p => p.id === id);
        const existing = cart.find(item => item.id === id);
        if (existing) existing.qty++;
        else cart.push({ ...product, qty: 1 });
        updateCart();
    };

    function updateCart() {
        const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const count = cart.reduce((sum, item) => sum + item.qty, 0);
        
        document.getElementById('float-total').innerText = total.toFixed(2);
        document.getElementById('float-count').innerText = count;
        document.getElementById('modal-total').innerText = total.toFixed(2);
        
        const list = document.getElementById('cart-items-list');
        list.innerHTML = cart.map(item => `
            <div class="cart-item">
                <span>${item.name} x ${item.qty}</span>
                <span>₹${(item.price * item.qty).toFixed(2)}</span>
            </div>
        `).join('');
    }

    // Modal Controls
    document.getElementById('open-cart-btn').onclick = () => document.getElementById('cart-modal').classList.add('active');
    document.getElementById('close-cart-btn').onclick = () => document.getElementById('cart-modal').classList.remove('active');

    // ==========================================
    // 3. PLACE ORDER (FIXED)
    // ==========================================
    document.getElementById('order-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (cart.length === 0) return alert('Cart is empty');

        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerText = 'Processing...';
        btn.disabled = true;

        const orderNum = 'ORD-' + Date.now().toString().slice(-6);
        const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const pickupSlot = `${document.getElementById('pickup-date').value} ${document.getElementById('pickup-time').value}`;

        try {
            // 1. Insert Order - USE 'db' NOT 'supabase'
            const { data: orderData, error: orderError } = await db
                .from('orders')
                .insert([{
                    order_number: orderNum,
                    customer_name: document.getElementById('cust-name').value,
                    customer_phone: document.getElementById('cust-phone').value,
                    pickup_slot: pickupSlot,
                    payment_method: document.getElementById('pay-method').value,
                    total: total,
                    note: document.getElementById('order-note').value,
                    status: 'New'
                }])
                .select()
                .single();

            if (orderError) throw orderError;

            // 2. Insert Items - USE 'db' NOT 'supabase'
            const items = cart.map(item => ({
                order_id: orderData.id,
                product_id: item.id,
                product_name: item.name,
                quantity: item.qty,
                price_at_order: item.price
            }));

            const { error: itemsError } = await db.from('order_items').insert(items);
            if (itemsError) throw itemsError;

            // 3. Success
            document.getElementById('cart-modal').classList.remove('active');
            document.getElementById('success-order-id').innerText = orderNum;
            document.getElementById('success-modal').classList.add('active');

        } catch (err) {
            console.error(err);
            alert('Error: ' + err.message);
            btn.innerText = 'Place Order';
            btn.disabled = false;
        }
    });

    // Start
    loadProducts();
</script>

</body>
</html>
